<!DOCTYPE html>
<html lang="en">
<head>
        
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Kora-Live TV Player</title>

    <style>
        #player-container {
            position: relative;
            overflow: hidden;
            padding-top: 56.25%;
        }

        #player-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            border: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
        }

        #watermark {
            position: fixed;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 18px;
            z-index: 9999;
        }
    </style>
  
</head>

<body>

<div id="player-container">
    <iframe id="player-iframe" allowfullscreen></iframe>
    <div id="watermark"></div>
</div>

<script>
    // Get ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const customID = urlParams.get('m');

    // Build EXACT same stream logic
    const originalURL = "https://wicket-goal.pages.dev/m3u/?src=https://live.inplyr.com/room/" 
                        + customID + ".m3u8";

    // Load iframe
    document.getElementById('player-iframe').src = originalURL;
</script>

</body>
</html>
